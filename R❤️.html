<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at top, #2a003f, #0a0015);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* sparkles */
.sparkles {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 50px 50px;
  animation: moveStars 20s linear infinite;
  opacity: 0.2;
}

@keyframes moveStars {
  from {transform: translateY(0);}
  to {transform: translateY(-1000px);}
}

.container {
  text-align: center;
  z-index: 2;
  padding: 20px;
}

h1 {
  font-size: 2rem;
  color: #d48cff;
  text-shadow: 0 0 15px #b300ff;
}

.small {
  margin-top: 8px;
  font-size: 0.9rem;
  color: #ccc;
}

.buttons {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 20px;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 1rem;
  transition: 0.3s;
}

#yesBtn {
  background: #b300ff;
  color: white;
  box-shadow: 0 0 20px #b300ff;
}

#noBtn {
  background: #444;
  color: white;
  position: relative;
}

#yesBtn:hover {
  transform: scale(1.1);
}

/* result */
#result {
  display: none;
  margin-top: 20px;
}

#result img {
  width: 200px;
  border-radius: 15px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="sparkles"></div>

<div class="container">
  <h1>Will you be mine RAVINA ❤️</h1>
  <div class="small">made by Kuldeep</div>

  <div class="buttons">
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>

  <div id="result">
    <h2>LOVE YOU RAVINA ❤️✨</h2>
    <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="cat hug">
  </div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");

// YES click
yesBtn.addEventListener("click", () => {
  document.querySelector(".buttons").style.display = "none";
  result.style.display = "block";
});

// NO button dodge logic (mobile + desktop)
noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

function moveButton() {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);

  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}
</script>

</body>
</html>
